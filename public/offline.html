<!doctype html>
<html lang="es">
<head>

  <meta name="theme-color" content="#f8f9fb">
  <meta name="color-scheme" content="light">
  <title>Sin conexión · Reventa Segura</title>
  <!-- Self-contained on purpose: this page is shown when nothing else can be fetched. System
       fonts, inline styles, no script (the Content-Security-Policy forbids inline scripts). -->
  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
           font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
           background: #f8f9fb; color: #111318; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 400px; }
    .panel { position: relative; overflow: hidden; border-radius: 32px; background: #0e1016; aspect-ratio: 4 / 3; }
    .panel svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .sky { fill: #83ddf4; }
    .mint { fill: #91ebcb; }
    .ring { fill: none; stroke: #0e1016; stroke-width: 22; }
    .ticket { fill: #ffffff; }
    .perf { fill: none; stroke: #7c828e; stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; }
    .line { fill: none; stroke: #111318; stroke-width: 5; stroke-linecap: round; }
    .label { margin: 28px 0 8px; color: #626873; font: 500 12px/1.4 ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace;
             letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 2.5rem; line-height: 1.02; letter-spacing: -0.045em; font-weight: 700; }
    p.text { color: #626873; margin: 0 0 28px; font-size: 1.0625rem; }
    .retry { display: flex; align-items: center; justify-content: center; width: 100%; font: inherit; font-weight: 600;
             min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: #111318; color: #ffffff; text-decoration: none; }
    .retry:focus-visible { outline: 2px solid #111318; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
        <circle class="sky" cx="200" cy="300" r="210"/>
        <circle class="ring" cx="200" cy="300" r="158"/>
        <circle class="ring" cx="200" cy="300" r="106"/>
        <circle class="mint" cx="200" cy="300" r="56"/>
        <g transform="rotate(-8 200 150)">
          <path class="ticket" d="M108 96H292A12 12 0 0 1 304 108V136A14 14 0 0 0 304 164V192A12 12 0 0 1 292 204H108A12 12 0 0 1 96 192V164A14 14 0 0 0 96 136V108A12 12 0 0 1 108 96Z"/>
          <path class="perf" d="M250 106V194"/>
          <path class="line" d="M124 132H206M124 160H176"/>
        </g>
      </svg>
    </div>
    <p class="label">Sin conexión</p>
    <h1>No hay internet.</h1>
    <p class="text">No pudimos conectarnos. Revisa tu conexión e inténtalo de nuevo: tus compras y tus publicaciones siguen guardadas.</p>
    <!-- A link to the current address, not an inline onclick: the CSP forbids inline scripts. -->
    <a class="retry" href="">Reintentar</a>
  </main>

</html>
