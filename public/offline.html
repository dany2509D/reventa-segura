<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
  <title>Sin conexión · Reventa Segura</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f6; --text: #141416; --muted: #585b66; --btn: #141416; --btn-text: #ffffff; --tile: #141416; --focus: #0a6a8a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0c0e; --text: #f4f4f6; --muted: #a5a7b0; --btn: #ffffff; --btn-text: #111113; --tile: #2a2a2f; --focus: #8fdcf5; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); text-align: center; }
    main { max-width: 360px; }
    svg { width: 64px; height: 64px; }
    .tile { fill: var(--tile); }
    h1 { font-size: 2rem; line-height: 1.1; letter-spacing: -0.025em; font-weight: 800; margin: 20px 0 12px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button { font: inherit; font-weight: 700; min-height: 48px; padding: 0 28px; border-radius: 999px;
             border: 0; background: var(--btn); color: var(--btn-text); cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path class="tile" d="M8 0H24A8 8 0 0 1 32 8V24A8 8 0 0 1 24 32H8A8 8 0 0 1 0 24V8A8 8 0 0 1 8 0Z"/>
      <path d="M8.5 9H23.5A2.5 2.5 0 0 1 26 11.5V13.4A2.6 2.6 0 0 0 26 18.6V20.5A2.5 2.5 0 0 1 23.5 23H8.5A2.5 2.5 0 0 1 6 20.5V18.6A2.6 2.6 0 0 0 6 13.4V11.5A2.5 2.5 0 0 1 8.5 9Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M12 16.2L14.8 19L20.2 13.2" fill="none" stroke="#8fdcf5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No pudimos conectarnos. Revisa tu internet e inténtalo de nuevo.<br>Tu compra y tu dinero siguen protegidos.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
