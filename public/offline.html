<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <title>Sin conexión · Reventa Segura</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box;
           font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #ffffff; color: #141416; text-align: center; }
    main { width: 100%; max-width: 380px; }
    .panel { border-radius: 32px; background: #ffe4f3; padding: 12px 0; }
    .panel svg { display: block; width: 100%; height: auto; }
    .circle { fill: #f8a8d8; }
    .ink { fill: none; stroke: #141416; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 2.125rem; line-height: 1.08; letter-spacing: -0.03em; font-weight: 800; margin: 24px 0 10px; }
    p { color: #5d606b; margin: 0 0 24px; }
    button { width: 100%; font: inherit; font-weight: 700; min-height: 54px; padding: 0 28px; border-radius: 999px;
             border: 0; background: #141416; color: #ffffff; cursor: pointer; }
    button:focus-visible { outline: 3px solid #141416; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <svg viewBox="0 0 240 200" aria-hidden="true" focusable="false">
        <path class="circle" d="M120 26A84 84 0 1 1 119.99 26Z"/>
        <g class="ink" transform="rotate(-9 120 112)">
          <path d="M66 76H174A10 10 0 0 1 184 86V101A11 11 0 0 0 184 123V138A10 10 0 0 1 174 148H66A10 10 0 0 1 56 138V123A11 11 0 0 0 56 101V86A10 10 0 0 1 66 76Z"/>
          <path d="M150 86V138" stroke-dasharray="1 10"/>
          <path d="M86 104h.01M116 104h.01" stroke-width="8"/>
          <path d="M84 120C93 132 109 132 118 120"/>
          <path d="M98 76C96 58 84 50 90 38C96 26 116 30 112 44C108 56 126 62 150 46"/>
        </g>
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No pudimos conectarnos. Revisa tu internet e inténtalo de nuevo.<br>Tu compra y tu dinero siguen protegidos.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
